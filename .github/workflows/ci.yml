# Chạy đúng ba lệnh mà một người sẽ chạy trước khi mở PR.
#
# Không chụp màn hình ở đây. Chúng nó cần một Chromium và một máy chủ tài khoản
# dựng riêng, mà thứ chúng trả lời là "nhìn có đúng không" — một câu hỏi cần
# người xem ảnh, chứ không phải một dấu tích xanh.
name: ci

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 22 là bắt buộc chứ không phải tuỳ chọn: cả máy chủ chạy trên
      # `node:sqlite`, và đó là lý do nó không có một thư viện ngoài nào.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
