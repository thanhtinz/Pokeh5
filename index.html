<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <title>Pokeh5</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#101828" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Idle Pokemon RPG" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0b101c;
        /* A WebView drags the whole page on a swipe unless every default
           gesture is taken away from it. */
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
      }
      #app {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
      }
      #app canvas {
        display: block;
        touch-action: none;
      }
      #splash {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        gap: 18px;
        align-content: center;
        background: radial-gradient(circle at 50% 38%, #1e2b4d 0%, #0b101c 70%);
        color: #cfd8ec;
        font: 600 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
        letter-spacing: 0.04em;
        transition: opacity 0.35s ease;
        z-index: 10;
      }
      #splash.hidden {
        opacity: 0;
        pointer-events: none;
      }
      #splash .ball {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        background: linear-gradient(#ee3f3f 0 47%, #17202f 47% 53%, #f2f4f8 53% 100%);
        box-shadow: 0 0 0 4px #17202f, 0 10px 30px rgba(0, 0, 0, 0.55);
        animation: spin 1.1s cubic-bezier(0.5, 0, 0.5, 1) infinite;
      }
      @keyframes spin {
        0%,
        20% {
          transform: rotate(0);
        }
        100% {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash .ball {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="splash"><div class="ball"></div><span>Đang khởi động…</span></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
