# Brings up the database, the portal and the game client with one command.
#
#   cp deploy/.env.example deploy/.env   # then edit it
#   docker compose -f deploy/docker-compose.yml up -d
#
# The .NET game services are NOT part of this stack — they are Windows-only
# binaries with no source in the release. See docs/SETUP.md for how to point
# them at the database this stack creates.

name: pokeh5

services:
  db:
    # 5.7 on purpose: the dump was taken from 5.7.26 and uses syntax that
    # MySQL 8 rejects outright.
    image: mysql:5.7
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-pokemon}
      MYSQL_USER: ${MYSQL_USER:-pokemon_portal}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # The dump contains zero dates and short-column inserts that strict mode
      # rejects; the game services expect the permissive behaviour.
      - --sql-mode=NO_ENGINE_SUBSTITUTION
    volumes:
      - db-data:/var/lib/mysql
      # Files here run once, in filename order, the first time the volume is
      # created. Drop the release's SQL in as described in the README.
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    ports:
      # Bound to loopback: the game services connect from the host, but the
      # database must not be reachable from the internet.
      - '127.0.0.1:${MYSQL_PORT:-3306}:3306'
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-p${MYSQL_ROOT_PASSWORD}']
      interval: 10s
      timeout: 5s
      retries: 20

  php:
    build:
      context: ./php
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: '3306'
      DB_NAME: ${MYSQL_DATABASE:-pokemon}
      DB_USER: ${MYSQL_USER:-pokemon_portal}
      DB_PASS: ${MYSQL_PASSWORD}
      PLAY_URL: ${PLAY_URL:-/game/}
      SUPPORT_ZALO: ${SUPPORT_ZALO:-}
      SUPPORT_BANK: ${SUPPORT_BANK:-}
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
    volumes:
      - ../portal:/var/www/portal:ro

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - php
    ports:
      - '${HTTP_PORT:-8080}:80'
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ../portal:/var/www/portal:ro
      # The Egret client from the release. Set CLIENT_DIR in .env to the
      # extracted `XJLserver/client/Pokemon` folder.
      - ${CLIENT_DIR:-./placeholder-client}:/var/www/game:ro

volumes:
  db-data:
