server {
    listen 80;
    server_name _;

    root /var/www/portal/public;
    index index.php index.html;

    charset utf-8;
    client_max_body_size 2m;

    # The Egret client is large and fully static, so it is served straight off
    # disk rather than through PHP.
    location /game/ {
        alias /var/www/game/;
        try_files $uri $uri/ /game/index.html;

        # Asset filenames carry a content hash, so they can be cached hard.
        location ~* \.(png|jpg|jpeg|gif|webp|mp3|mp4|ogg|json|js|css|woff2?|ttf|svg)$ {
            alias /var/www/game/;
            try_files $uri =404;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_read_timeout 30s;
    }

    # Nothing outside public/ is web-reachable. The release shipped its config
    # — including the database root password — inside the web root.
    location ~ ^/(config|src|bin|sql|tests)/ {
        deny all;
        return 404;
    }

    location ~ /\. {
        deny all;
        return 404;
    }

    # The release bundled phpMyAdmin in the web root. If you restore the
    # original files, this keeps it from being served by accident.
    location ~ ^/phpMyAdmin {
        deny all;
        return 404;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;
}
