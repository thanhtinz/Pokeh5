; Production defaults for the portal container.

; Errors go to the container log, never into a response body — a stack trace on
; a login page tells an attacker exactly what the code does.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
error_reporting = E_ALL

expose_php = Off

session.save_path = /var/lib/php/sessions
session.cookie_httponly = On
session.cookie_samesite = Lax
session.use_strict_mode = On
session.gc_maxlifetime = 7200

; The portal takes no uploads.
file_uploads = Off
post_max_size = 1M
max_input_vars = 200

date.timezone = Asia/Ho_Chi_Minh
